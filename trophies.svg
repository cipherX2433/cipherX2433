<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#f9a8d4"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="s"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><style>@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}</style></defs>
<rect width="640" height="230" rx="24" fill="#0d0814" stroke="#6d3b83"/><text x="28" y="38" font-family="ui-sans-serif,system-ui" font-size="16" font-weight="800" fill="#fff">ACHIEVEMENT VAULT</text>
